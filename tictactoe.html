
<html>
<head>
	
<style>
body
{	
 height:199%;
 background:#070;
}
#idbtn
{	 
 position:absolute;
 cursor:pointer;
 left:40%; 
 bottom:11%;	 
 width:16%;	  
 background:#707;
 color:#bbb;
 font-size:2em;
 border-radius:23%;
}
	
#idcont
{	 
 position:absolute;
 transition:2s;
 left:17%; 
 top:11%;	 
 width:66%;	  
 height:77%;
 background:#770;
 border:5px ridge #f00;
 border-radius:22%;
 text-align:center;
}
	
.cell
{
 position:absolute;
 transition:777ms;
 width:9%;	  
 height:9%;
 background:#999;
 font-size:3em;
 border:4px solid #990;
 cursor:pointer;
}
.cell:hover
{
 transform:scale(1.2);
 z-index:1;
}
	 
.ttl
{
 position:absolute;
 transition:1s;
 color:#609;
 font-size:5em;
 cursor:pointer;
}

.sbtl,.cll
{
 position:absolute;
 transition:1s;
}
.cll
{ 
 width:12.5%;  height:12.5%; 
 background:#888;
}

</style>
</head>
<body id=idbd>

<div id=idcont> 
 <div class='ttl'> Click any cell </div>
     
<div class='cell'></div>
<div class='cell'></div>
<div class='cell'></div>
<div class='cell'></div>
<div class='cell'></div>
<div class='cell'></div>
<div class='cell'></div>
<div class='cell'></div>
<div class='cell'></div>

  <div class='ttl'>Winner</div>
  <div class='ttl'>X</div>

<button id='idbtn'>Reset</button>
  
</div>  
 
<div class=sbtl></div>
 
<script >
ttl=document.getElementsByClassName('ttl') 
c=document.getElementsByClassName('cell') 
sbtl=document.getElementsByClassName('sbtl') 
cll=document.getElementsByClassName('cll') 
 
i=0, j=0 
for(k=0;k<9;k++)
{
 c[k].style.left=(33+11*i)+'%'
 c[k].style.top=(33+12*j)+'%'
  i++; 
  if(i%3==0){j++; i=0;}
}

ttl[0].style.left=16+'%'
ttl[0].style.top=0+'%'
ttl[0].style.color='#b0b'
ttl[1].style.left=33+'%'
ttl[1].style.color='#b00'
ttl[1].style.transform='scale(0)'
ttl[2].style.left=33+'%'
ttl[2].style.color='#500'
ttl[2].style.transform='scale(0)'

cl=[], clrs=['#f00','#0f0','#00f']
c0=[]; c1=[]; c2=[]; c3=[]; c4=[];
 c5=[]; c6=[]; c7=[]
sbtl[0].style.cursor='pointer'
sbtl[0].style.left=12+'%'
sbtl[0].style.top=111+'%'
sbtl[0].style.width=76+'%'
sbtl[0].style.height=77+'%'
sbtl[0].style.border='8px ridge #ff0'
for(j=0;j<8;j++)
{
  cl[j]=document.createElement("div")
  cl[j].className='cll'
   cl[j].style.top=j*12.5+'%'
   cl[j].style.width=100+'%'
   cl[j].style.height=12.5+'%'
   cl[j].style.background=
    clrs[Math.round(Math.random()*3)-1]
    sbtl[0].appendChild(cl[j])
}

function inn(c,n)
{
for(i=0;i<8;i++)
{
   c[i]=document.createElement("div")
   c[i].className='cll'
   c[i].style.left=i*12.5+'%'
   c[i].style.width=12.5+'%'
   c[i].style.height=100+'%'
   c[i].style.background=
    clrs[Math.round(Math.random()*3)-1]
    cl[n].appendChild(c[i])
}
}
 inn(c0,0), inn(c1,1), inn(c2,2),inn(c3,3)
 inn(c4,4), inn(c5,5), inn(c6,6),inn(c7,7)

 
idcont.onmouseover=()=>
{
 idcont.style.transform='scale(1.2)'
}
idcont.onmouseout=()=>
{
 idcont.style.transform='scale(1)'
}
ttl[0].onmouseover=()=>
{
 ttl[0].style.color='#d0d'
}
ttl[0].onmouseout=()=>
{
 ttl[0].style.color='#b0b'
}
idbtn.onclick=()=>
{
 ttl[1].style.transform='scale(0)'
 ttl[2].style.transform='scale(0)' 
 for(k=0;k<9;k++)
  c[k].innerHTML=''
} 

function  comb(v)
{
 if((c[0].innerHTML==v)&&
  (c[1].innerHTML=='X')&&(c[2].innerHTML=='X')||
  (c[3].innerHTML=='X')&&
  (c[4].innerHTML=='X')&&(c[5].innerHTML=='X')||
  (c[6].innerHTML=='X')&&
  (c[7].innerHTML=='X')&&(c[8].innerHTML=='X')|| 
  (c[0].innerHTML=='X')&&
  (c[3].innerHTML=='X')&&(c[6].innerHTML=='X')||
  (c[1].innerHTML=='X')&&
  (c[4].innerHTML=='X')&&(c[7].innerHTML=='X')||
  (c[2].innerHTML=='X')&&
  (c[5].innerHTML=='X')&&(c[8].innerHTML=='X')||  
  (c[0].innerHTML=='X')&&
  (c[4].innerHTML=='X')&&(c[8].innerHTML=='X')||
  (c[2].innerHTML=='X')&&
  (c[4].innerHTML=='X')&&(c[6].innerHTML=='X') )
  {
    ttl[2].innerHTML=v
   ttl[1].style.transform=
    'scale(1.7) translate(8%,38%)'
   ttl[2].style.transform=
    'scale(1.7) translate(399%,100%)'
  }
}

ii=0
function  clk(i)
{
 c[i].onclick=()=>
 {
  c[i].innerHTML='X'
  //while(ii==i)
   ii=Math.round(Math.random()*9)
  c[ii].innerHTML='0'
   comb('X')
   //comb('0')
 }
}
 clk(0), clk(1), clk(2)
 clk(3), clk(4), clk(5)
 clk(6), clk(7), clk(8)

Isbtl=0
sbtl[0].onmouseover=()=>
{
 sbtl[0].style.transform='scale(1.1)'
 Isbtl=setInterval(()=>{
  for(i=0;i<8;i++)
   {
    c0[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1]
    c1[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1] 
    c2[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1] 	
    c3[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1] 
    c4[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1]
    c5[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1] 
    c6[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1] 	
    c7[i].style.background=//'#000'
     clrs[Math.round(Math.random()*3)-1]  	 
   }    
 }, 999)
}
sbtl[0].onmouseout=()=>
{
  clearInterval(Isbtl)
 sbtl[0].style.transform='scale(1)'
}

//alert(cc[4])
</script>
</body>
</html>
