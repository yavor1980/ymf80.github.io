<html>
<body id=idbd>
<style>

#idbd
{
 background:radial-gradient(222px,#999,#333);
}

.hd,.slte,.ppp
{
 position:absolute;
 transition:1s; 
}
.slte,.ppp
{
 border-radius:55%;
}

</style>
<div class=hd>Waiting...</div>
<div class=hd>When?..</div>
 <div class=hd></div>
 <div class=hd></div>

<div class=slte>
 <div class=slte></div>
 <div class=slte></div>
 <div class=slte></div>
 <div class=slte></div>
 <div class=slte></div>
</div>
<div class=slte>
 <div class=slte></div>
 <div class=slte></div>
 <div class=slte></div>
 <div class=slte></div>
 <div class=slte></div>
</div>

<div class=ppp>
 <div class=ppp></div>
 <div class=ppp></div>
 <div class=ppp></div>
</div>
<div class=ppp></div>
<div class=ppp></div>

<script>
hd=document.getElementsByClassName('hd')  
slte=document.getElementsByClassName('slte')
ppp=document.getElementsByClassName('ppp')
     
hd[0].style.left=44+'%'
hd[0].style.top=33+'%'
hd[0].style.color='#b00'
hd[0].style.cursor='pointer'
hd[0].style.transform='scale(7)'
hd[1].style.left=44+'%'
hd[1].style.top=58+'%'
hd[1].style.color='#900'
hd[1].style.cursor='pointer' 
hd[1].style.transform='scale(7)'
hd[2].style.left=12+'%'
hd[2].style.top=24+'%'
hd[2].style.width=78+'%'
hd[2].style.height=43+'%'
hd[2].style.background=
 'radial-gradient(#ff0,#f0f,#0f0,#f0f,#00f)'
hd[2].style.borderRadius=8+'%'
hd[2].style.opacity=0
hd[2].style.zIndex=-1
hd[3].style.left=5+'%'
hd[3].style.bottom=4+'%'
hd[3].style.width=90+'%'
hd[3].style.height=9+'%'
hd[3].style.background=
 'radial-gradient(#f00,#000,#f00,#000,#f00)'
hd[3].style.borderRadius=55+'%'
hd[3].style.opacity=0
hd[3].style.zIndex=-1

slte[0].style.left=46+'%'
slte[0].style.bottom=9+'%'
slte[0].style.width=2+'%'
slte[0].style.height=3+'%'
slte[0].style.background=
 'radial-gradient(11px,#ff0,#f00)'
slte[0].style.borderRadius=55+'%'
slte[0].style.transform='scale(0)'
function inslte(islte)
{
slte[islte].style.width=22+'%'
slte[islte].style.height=33+'%'
slte[islte].style.background=
 'radial-gradient(#f00,#ff0)'
}  
 inslte(1); inslte(2); inslte(3);
 inslte(4); inslte(5);

slte[6].style.left=46+'%'
slte[6].style.bottom=9+'%'
slte[6].style.width=2+'%'
slte[6].style.height=3+'%'
slte[6].style.background=
 'radial-gradient(11px,#ff0,#f0f)'
slte[6].style.borderRadius=55+'%'
slte[6].style.transform='scale(0)'
 inslte(7);
 slte[7].style.background=
  'radial-gradient(11px,#ff0,#f0f)'
 inslte(8); 
 slte[8].style.background=
  'radial-gradient(11px,#ff0,#0ff)'
 inslte(9); 
 slte[9].style.background=
  'radial-gradient(11px,#f0f,#ff0)'
 inslte(10); 
 slte[10].style.background=
  'radial-gradient(11px,#f00,#ff0)'
 inslte(11); 
 slte[11].style.background=
  'radial-gradient(11px,#f0f,#ff0)'
 
ppp[0].style.left=78+'%'
ppp[0].style.bottom=22+'%'
ppp[0].style.width=22+'px'
ppp[0].style.height=22+'px'
ppp[0].style.transform='scale(0)'
ppp[0].style.opacity=0.8
ppp[1].style.left=0+'%'
ppp[1].style.top=0+'%'
ppp[1].style.width=100+'%'
ppp[1].style.height=100+'%'
ppp[1].style.zIndex=1
ppp[1].style.background=
 'radial-gradient(3px,#990,#000)'
ppp[1].style.transform='scale(1)' 
ppp[2].style.left=0+'%'
ppp[2].style.top=0+'%'
ppp[2].style.width=100+'%'
ppp[2].style.height=100+'%'
ppp[2].style.background=
 'radial-gradient(#bb0,#f00)'
ppp[2].style.borderRadius=22+'%' 
ppp[2].style.transform='scale(1.8) '
ppp[3].style.left=0+'%'
ppp[3].style.top=0+'%'
ppp[3].style.width=100+'%'
ppp[3].style.height=100+'%'
ppp[3].style.background=
 'radial-gradient(#bb0,#f00)'
ppp[3].style.borderRadius=22+'%' 
ppp[3].style.transform=
 'scale(1.8) rotate(45deg)'
ppp[4].style.left=18+'%'
ppp[4].style.top=12+'%'
ppp[4].style.width=70+'%'
ppp[4].style.height=7+'%'
ppp[4].style.borderTop='22px ridge #f00'
ppp[4].style.borderRadius=55+'%'  
ppp[4].style.opacity=0
ppp[5].style.left=18+'%'
ppp[5].style.top=19+'%'
ppp[5].style.width=70+'%'
ppp[5].style.height=7+'%'
ppp[5].style.borderTop='22px ridge #f0f'
ppp[5].style.borderRadius=55+'%'  
ppp[5].style.opacity=0 
 
Icl=0; bcl=0
function cl()
{
 if(bcl){
  hd[0].style.transform='scale(7)'
  hd[1].style.transform='scale(9)'
 }else{
  hd[0].style.transform='scale(9)'
  hd[1].style.transform='scale(7)'
 }	  
 bcl=!bcl
}  
  Icl=setInterval(()=>cl(),999)
  
function sltcl()
{
 if(bcl){
  hd[2].style.transform='skew('+
   (Math.random()*22-11)+'deg)'
  slte[0].style.transition='999ms'
  slte[0].style.transform=
   'scale(1.2) translate('+(Math.random()*666-333)+
   '%,-888%)'
  slte[6].style.transition='999ms'
  slte[6].style.transform=
   'scale(1.2) translate('+(Math.random()*1999-999)+
   '%,-999%)'  
  ppp[0].style.transform='scale('+(1.6*Math.random()+5)+
   ') translate(-66%,-93%)'+
   'rotate('+(Math.random()*444-222)+'deg)' 
  ppp[4].style.opacity=1
  ppp[4].style.transform='scale('+(1+Math.random()/4)+ 
   ') translate(0%,'+(-76*Math.random())+'%)'
  ppp[5].style.opacity=1
  ppp[5].style.transform='scale('+(1+Math.random()/4)+ 
   ') translate(0%,'+(-76*Math.random())+'%)'
  setTimeout(()=>{
   slte[1].style.transition='444ms'
   slte[1].style.opacity=0.5
   slte[1].style.transform=
    'scale(9) translate(-'+(222+Math.random()*111)+
	'%,-88%)'	
   slte[2].style.transition='444ms'
   slte[2].style.opacity=0.5
   slte[2].style.transform=
    'scale(9) translate(0%,-'+(222+Math.random()*111)+
	'%)'	
   slte[3].style.transition='444ms'
   slte[3].style.opacity=0.5
   slte[3].style.transform=
    'scale(9) translate('+(222+Math.random()*111)+
	'%,-88%)'	
   slte[4].style.transition='444ms'
   slte[4].style.opacity=0.5
   slte[4].style.transform=
    'scale(9) translate(-'+(222+Math.random()*111)+'%,-'+
     (222+Math.random()*111)+'%)'	
   slte[5].style.transition='444ms'
   slte[5].style.opacity=0.5
   slte[5].style.transform=
    'scale(9) translate('+(222+Math.random()*111)+'%,-'+
     (222+Math.random()*111)+'%)'	
   slte[7].style.transition='444ms'
   slte[7].style.opacity=0.5
   slte[7].style.transform=
    'scale(9) translate(-'+(222+Math.random()*111)+
	'%,-88%)'	
   slte[8].style.transition='444ms'
   slte[8].style.opacity=0.5
   slte[8].style.transform=
    'scale(9) translate(0%,-'+(222+Math.random()*111)+
	'%)'	
   slte[9].style.transition='444ms'
   slte[9].style.opacity=0.5
   slte[9].style.transform=
    'scale(9) translate('+(222+Math.random()*111)+
	'%,-88%)'	
   slte[10].style.transition='444ms'
   slte[10].style.opacity=0.5
   slte[10].style.transform=
    'scale(9) translate(-'+(222+Math.random()*111)+'%,-'+
     (222+Math.random()*111)+'%)'	
   slte[11].style.transition='444ms'
   slte[11].style.opacity=0.5
   slte[11].style.transform=
    'scale(9) translate('+(222+Math.random()*111)+'%,-'+
     (222+Math.random()*111)+'%)'
  }, 444)
 }
 else
 {
  slte[0].style.transition='0s'
  slte[0].style.transform='scale(0)'
  slte[1].style.transition='0ms'
  slte[1].style.transform='scale(0)'
  slte[2].style.transition='0ms'
  slte[2].style.transform='scale(0)'	
  slte[3].style.transition='0ms'
  slte[3].style.transform='scale(0)'	 
  slte[4].style.transition='0ms'
  slte[4].style.transform='scale(0)'	
  slte[5].style.transition='0ms'
  slte[5].style.transform='scale(0)'
  slte[6].style.transition='0s'
  slte[6].style.transform='scale(0)'
  slte[7].style.transition='0ms'
  slte[7].style.transform='scale(0)'
  slte[8].style.transition='0ms'
  slte[8].style.transform='scale(0)'	
  slte[9].style.transition='0ms'
  slte[9].style.transform='scale(0)'	 
  slte[10].style.transition='0ms'
  slte[10].style.transform='scale(0)'	
  slte[11].style.transition='0ms'
  slte[11].style.transform='scale(0)' 
 }	  
  bcl=!bcl
}  

hd[0].onmouseover=()=>
{
 idbd.style.background=
  'linear-gradient(#00f,#ff0)'
 hd[0].style.color='#f00'
 hd[0].style.transform='scale(9) skew(-22deg)'
  hd[0].innerHTML='VICTORY!..'
 hd[1].style.transform='scale(9) skew(22deg)'
  hd[1].innerHTML='PEACE!..'
 hd[2].style.opacity=0.8
 hd[3].style.opacity=0.8
  clearInterval(Icl)
  sltcl(); Icl=setInterval(()=>sltcl(), 999)
}
hd[0].onmouseout=()=>
{
 idbd.style.background=
  'radial-gradient(222px,#999,#333)'
 slte[0].style.transition='0s'
 slte[0].style.transform=
  'scale(0) translate(0%,0%)'
 slte[6].style.transition='0s'
 slte[6].style.transform=
  'scale(0) translate(0%,0%)'  
 hd[0].style.color='#b00'
 ppp[0].style.transform='scale(0)'
 ppp[4].style.opacity=0
 ppp[5].style.opacity=0
  hd[0].innerHTML='Waiting...' 
  hd[1].innerHTML='When?..'
 hd[2].style.opacity=0
 hd[3].style.opacity=0
  clearInterval(Icl)
  cl(); Icl=setInterval(()=>cl(),999)
}

hd[1].onmouseover=()=>{
 hd[0].onmouseover()
}
hd[1].onmouseout=()=>{
 hd[0].onmouseout()
} 
 
</script>
</body>
</html>
