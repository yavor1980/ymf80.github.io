<script>

csvg[0].style.height=28+'%'
csvg[0].style.background='#888'
csvg[0].style.opacity=0.4
function insvgrnd(i,rr)
{
 csvg[1].style.transform='scale(1)'
 csvg[i].style.cx=50+'%'
 csvg[i].style.cy=50+'%'
 csvg[i].style.r=rr
 csvg[i].style.fill='#ff0'
 csvg[i].style.strokeWidth=7
 csvg[i].style.stroke='#0f0'
 csvg[2].style.transform='scale(0)'
}
function insvgrect(i)
{
 csvg[2].style.transform='scale(1)'
 csvg[i].style.x=25+'%'
 csvg[i].style.y=25+'%'
 csvg[i].style.width=44+'%'
 csvg[i].style.height=44+'%'
 csvg[i].style.fill='#f00'
 csvg[i].style.strokeWidth=9
 csvg[i].style.stroke='#0ff'
 csvg[1].style.transform='scale(0)'
}
 insvgrnd(1,44)
 insvgrect(2)
csvg[3].style.left=64+'%'
csvg[3].style.top=78+'%' 
csvg[3].style.transform='scale(0)'
  
dsply[0].style.left=19+'%'

dsply[0].style.height=22+'%'

pnel[0].style.borderRadius=15+'%'

function inp(i,l,t,w,h,bkgr)
{
 pnel[i].style.left=l+'%'
 pnel[i].style.top=t+'%'
 pnel[i].style.width=w+'%'
 pnel[i].style.height=h+'%'
 pnel[i].style.background=bkgr
}
inp(1,2,2,26,44,'#333')
inp(2,31,2,37,44,'#333')
inp(3,72,2,26,44,'#333')
inp(4,2,50,26,44,'#333')
inp(5,31,50,37,44,'#333')
inp(6,72,50,26,44,'#333')
inp(7,99,44,'','','')
 pnel[7].style.transform='scale(0)'
 
trmo[0].style.left=9+'%'
trmo[0].style.top=108+'%'
trmo[0].style.width=82+'%'
trmo[0].style.height=65+'%' 
trmo[0].style.background='#ff0'
trmo[0].style.borderRadius=5+'%'
trmo[1].style.left=17+'%'
trmo[1].style.top=4+'%'

trmo[2].style.height=99+'px'

trmo[2].style.borderBottom='55px solid #000' 
trmo[3].style.zIndex=1
trmo[3].style.left=47+'%'
trmo[3].style.top=-22+'%'
trmo[3].style.width=111+'px'
trmo[3].style.height=111+'px'
trmo[3].style.borderTop='33px ridge #990'
trmo[3].style.borderRight='33px ridge #990'
trmo[3].style.transform='rotate(45deg)'
trmo[4].style.left=-14+'%'
trmo[4].style.top=28+'%'

trmo[4].style.height=9+'px'

trmo[4].style.borderRadius=55+'%'

trmo[5].style.height=122+'px'
trmo[5].style.opacity=0.4
trmo[5].style.borderTop='15px solid  #900'
trmo[5].style.borderBottom='15px solid #900'  
clma[0].style.left=-18+'%'
clma[0].style.top=-23+'%'
clma[1].style.left=-18+'%'
clma[1].style.top=88+'%'

sv[0].style.cursor='pointer'
sv[0].style.left=9+'%'
sv[0].style.top=188+'%'
sv[0].style.width=82+'%'
sv[0].style.height=65+'%'
sv[0].style.background='#ff0'
sv[0].style.borderRadius=5+'%'
sv[1].style.left=9+'%'
sv[1].style.top=20+'%'
sv[1].style.width=44+'%'
sv[1].style.height=39+'%'
sv[1].style.border='33px ridge #000'

sv[1].style.opacity=0.2

sv[2].style.height=99+'%'
sv[2].style.border='33px ridge #000'

sv[3].style.left=-22+'%'

sv[3].style.height=109+'%'
sv[3].style.border='13px ridge #000'
sv[3].style.borderLeft='33px ridge transparent'
sv[3].style.borderRight='33px ridge transparent'
 
bbtn=1
btn[0].onclick=()=>
{
 if(bbtn)
 {
  btn[0].innerHTML='rect'
   insvgrnd(1,44)
 } 
  else
 {
  btn[0].innerHTML='circle'
   insvgrect(1)
 } 
   bbtn=!bbtn
}

Idsply=0; vdspl=0
function fdsply()
{
  vdspl=Math.random()*33+33
 dsply[1].style.background=
  'radial-gradient('+vdspl+
  'px,#f00,#ff0,#00b,#666)'
 pnel[1].style.background=
  '#'+Math.round(Math.random()*9)+'00'
 pnel[2].style.background=
  '#'+Math.round(Math.random()*9)+'00'
 pnel[3].style.background=
  '#'+Math.round(Math.random()*9)+'00'
 pnel[4].style.background=
  '#'+Math.round(Math.random()*9)+'00'
 pnel[5].style.background=
  '#'+Math.round(Math.random()*9)+'00'
 pnel[6].style.background=
  '#'+Math.round(Math.random()*9)+'00' 
 pnel[7].style.background='skew('+
  Math.round(66-Math.random()*33)+'deg)' 
 pnel[7].style.transform=
 pnel[7].style.transform=
  'scale('+(6+Math.random())+
  ') translate(33%,-33%)  skew('+
  (33*Math.random())+'deg)'
}
dsply[0].onmouseover=()=>
{
 dsply[0].style.transform='scale(2)'
  fdsply()
  Idsply=setInterval(()=>fdsply(), 999)
 dsply[2].style.background=
  'radial-gradient(#0f0,#090)'
 dsply[3].style.background=
  'linear-gradient(90deg,#055,#111,#555,#111,#055)'
 pnel[0].style.transform='scale(1.1)'
 pnel[7].style.color='#ff0'
 pnel[7].style.transform=
  'scale(6) translate(33%,-33%)  skew(33deg)'
 csvg[0].style.opacity=1
 csvg[0].style.border='7px ridge #bb0'
 csvg[0].style.borderRadius=22+'%'
 csvg[0].style.transform=
  'scale(1.7) translate(-12%,-69%)'
 csvg[3].style.color='#f00'
 csvg[3].style.transform=
  'scale(5) translate(83%,-42%)skew(-24deg) '
}
dsply[0].onmouseout=()=>
{
 dsply[0].style.transform='scale(2) skew(11deg)'
  clearInterval(Idsply); vdspl=9 
 dsply[1].style.background='#555'
 dsply[2].style.background='#222'
 dsply[3].style.background='#111'
 pnel[0].style.transform='scale(1)'
 pnel[1].style.background='#000'
 pnel[2].style.background='#000'
 pnel[3].style.background='#000'
 pnel[4].style.background='#000'
 pnel[5].style.background='#000'
 pnel[6].style.background='#000'
 pnel[7].style.color='#000'
 pnel[7].style.transform='scale(0)'
 csvg[0].style.opacity=0.4
 csvg[0].style.border='none'
 csvg[0].style.borderRadius=0+'%'
 csvg[0].style.transform='scale(1)'
 csvg[3].style.color='#000'
 csvg[3].style.transform='scale(0)'
}

trmo[1].onmouseover=()=>
{
 trmo[1].style.transform=
  'scale(5) translate(14%,6%)  skew(-23deg)'
 trmo[2].style.borderTop='55px solid #400'
 trmo[2].style.borderBottom='55px solid #400'  
 trmo[2].style.transform=
  'scale(1.2) translate(88%,0)' 
 trmo[3].style.borderTop='33px ridge #f00'
 trmo[3].style.borderRight='33px ridge #f00'
 trmo[4].style.opacity=1
 trmo[4].style.transform='scale(2)'
 trmo[5].style.opacity=1
 Itrmo=setInterval(()=>
 {
  trmo[3].style.transform='scale('+
   (1+Math.random()/2)+') rotate(45deg)'
  trmo[4].style.transform='scale('+
   (2+2*Math.random())+',2)'
  trmo[5].style.transform='scale('+
   (1+Math.random())+',1) translate(-22%,0)'  
 }, 999)
}
trmo[1].onmouseout=()=>
{
 trmo[1].style.transform='scale(3)'
 trmo[2].style.borderTop='55px solid #000'
 trmo[2].style.borderBottom='55px solid #000'
 trmo[2].style.transform='scale(1)'
 trmo[3].style.borderTop='33px ridge #990'
 trmo[3].style.borderRight='33px ridge #990'
 trmo[3].style.transform='scale(1) rotate(45deg)'
 trmo[4].style.opacity=0
 trmo[4].style.transform='scale(1)'
 trmo[5].style.opacity=0.4
 trmo[5].style.transform='scale(1)'
  clearInterval(Itrmo)
}
trmo[2].onmouseover=()=>
{
 trmo[1].onmouseover()
}
trmo[2].onmouseout=()=>
{
 trmo[1].onmouseout()
}

sv[0].onmouseover=()=>
{ 
 sv[1].style.borderRight='33px ridge #f00'
 sv[1].style.borderLeft='33px ridge transparent'
 sv[1].style.opacity=1
 sv[1].style.transform=
  'scale(1.1) translate(28%,0)'
 sv[2].style.border='33px ridge #f00'
 sv[2].style.transform=
  'scale(1.8,1) translate(9%,0)' 
 sv[3].style.border='13px ridge #f00'
 sv[3].style.borderLeft='33px ridge transparent'
 sv[3].style.borderRight='33px ridge transparent'
 sv[3].style.transform='translate(-15%,0)'
 Isv=setInterval(()=>{
  sv[2].style.transform=
  'scale('+(1.8+Math.random()/2)+',1) translate(9%,0)' 
 }, 999)  
}
sv[0].onmouseout=()=>
{
 sv[1].style.border='33px ridge #000'
 sv[1].style.borderLeft='33px ridge transparent'
 sv[1].style.opacity=0.2
 sv[1].style.transform='scale(1)'
 sv[2].style.border='33px ridge #000'
 sv[2].style.transform='scale(1)'
 sv[3].style.border='13px ridge #000'
 sv[3].style.borderLeft='33px ridge transparent'
 sv[3].style.borderRight='33px ridge transparent'
 sv[3].style.transform='scale(1)'
  clearInterval(Isv)
}

</script>
