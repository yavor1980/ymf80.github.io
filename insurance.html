<body id=idbd>
<style>
#idbd
{
 height:188%;

}

{
 cursor:pointer;

:text-align:center;

}

.btn,.pnl,.mnge,.term,.ttl,.rslt,.insrnsd
{

}
.pnl,.mnge,.term,.ttl

.insrnsd
{

 padding-down:3px;
}

</style>
<div class=pnl>

 <input type=submit class=btn value='Health'>
 <input type=submit class=btn value='Ownership' >
 <input type=submit class=btn value='Auto'>
 <input type=submit class=btn value='Tourism'>

</div>
<div class=pnl>

  <button class=mnge disabled>OK</button>

   <option >1 year</option>
   <option >2 years</option>
   <option >3 years</option>

function fbtn(i,clr,str)
{
 btn[i].onmouseover=()=>
 { 
  btn[i].style.transform='scale(2.2)'
  ttl[3].style.transform='scale(5) skew(-12deg)'
 }
 btn[i].onmouseout=()=>
 { 
  btn[i].style.transform='scale(2)'
  ttl[3].style.transform='scale(3) skew(-12deg)'
 }
 btn[i].onclick=()=>
 {  
   mnge[1].disabled=0
   mnge[2].disabled=0
  ttl[0].style.zIndex=1
  ttl[0].style.transform=
   'scale(3) translate(0,-2%) skew(-8deg)'
  ttl[3].style.zIndex=1
  ttl[3].style.color=clr 
  ttl[3].style.transform=
   'scale(5) translate(-52%,-52%) skew(-12deg)'
   ttl[3].innerHTML=str 
  mnge[1].style.cursor='pointer' 
  mnge[1].style.zIndex=1
  mnge[1].style.transform=
   'scale(7) translate(-33%,-25%)' 
  mnge[2].style.cursor='pointer' 
   pi=i
 } 
}

 fbtn(2,'#0f0','Ownership'), fbtn(3,'#fb0','Auto'), 
 fbtn(4,'#f0b','Tourism')

{

 mnge[2].style.cursor='default'  
  mnge[2].disabled=1

 term[2].style.cursor='pointer' 
  term[2].disabled=0
 for(i=0;i<6;i++)
  insrnsd[i].style.cursor='pointer' 
 insrnsd[pi].style.opacity=1
 insrnsd[pi].style.fontSize=3+'em'
}
mnge[2].onclick=()=>
{ 
 ttl[0].style.transform='scale(3) skew(-12deg)'
  ttl[3].innerHTML=''
  mnge[1].disabled=1
  mnge[1].style.transform='scale(3)'
  mnge[2].disabled=1
}  

term[2].onclick=()=>
{

 term[2].style.cursor='default' 
  term[2].disabled=1
