<DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
</head>
<body id=idbd>
<style>
#idbd
{
 background: linear-gradient(#505,#000);
}

.sol
{
 position:absolute;   
 transition:2s;
 background: radial-gradient(#bb0,#f00);
 border-radius:55%; 
 transition-timing-function:linear;
}
.plnt
{
 position:absolute;  
 transition:4s;
 border-radius:55%; 
 transition-timing-function:linear;
}

.strs
{
 position:absolute;  
 transition:2s;
 width:0.4%;
 height:1%;
 background:radial-gradient(#888,#ff0);
 border-radius:55%;
 z-index:-1;
}

.shtl,.flme,.spce,.adds
{
 position:absolute;  
 transition:1s;
}
.shtl{cursor:pointer;}
.flme{border-radius:55%;}
.spce{z-index:1;}

</style>

<div class=sol>
 <div class=sol></div>
 <div class=plnt></div>
 <div class=plnt></div>
 <div class=plnt></div>
</div>

<div class=shtl>
 <div class=shtl><div class=flme></div></div>
 <div class=shtl><div class=flme></div></div>
 <div class=shtl><div class=flme></div></div>
 <div class=shtl></div>
</div>

<div class=strs></div>
<div class=strs></div>
<div class=strs></div>
<div class=strs></div>
<div class=strs></div>

<div class=spce></div>
<div class=spce>
 <div class=spce></div>
 <div class=spce></div>
 <div class=spce></div>
 <div class=spce></div>
</div>

<div class=adds>
 <div class=adds></div>
 <div class=adds></div>
 <div class=adds></div>
</div>

<script>
strs=document.getElementsByClassName('strs')

sol=document.getElementsByClassName('sol')
plnt=document.getElementsByClassName('plnt')
shtl=document.getElementsByClassName('shtl')
flme=document.getElementsByClassName('flme')

spce=document.getElementsByClassName('spce')
adds=document.getElementsByClassName('adds')

sol[0].style.left=22+'%'
sol[0].style.top=22+'%'  
sol[0].style.width=27+'%'
sol[0].style.height=55+'%'  
sol[1].style.left=-6+'%'
sol[1].style.top=-6+'%'  
sol[1].style.width=111+'%'
sol[1].style.height=111+'%'
sol[1].style.opacity=0.2
 
plnt[0].style.left=Math.random()*77+'%'
plnt[0].style.top=Math.random()*77+'%'  
plnt[0].style.width=44+'%'
plnt[0].style.height=44+'%'
plnt[0].style.background=
 'radial-gradient(#0f0,#333)'
plnt[1].style.left=Math.random()*77+'%'
plnt[1].style.top=Math.random()*77+'%'  
plnt[1].style.width=33+'%'
plnt[1].style.height=33+'%'
plnt[1].style.background=
 'radial-gradient(#f00,#000)'
plnt[2].style.left=Math.random()*77+'%'
plnt[2].style.top=Math.random()*77+'%'  
plnt[2].style.width=22+'%'
plnt[2].style.height=22+'%'  
plnt[2].style.background=
 'radial-gradient(#ff0,#333)'
	 
shtl[0].style.left=66+'%'
shtl[0].style.top=45+'%'  
shtl[0].style.width=16+'%'
shtl[0].style.height=11+'%' 
shtl[0].style.transform=
 'rotate(0deg)  skew(44deg)'
shtl[1].style.left=6+'%'
shtl[1].style.top=-3+'%'  
shtl[1].style.width=99+'%'
shtl[1].style.height=33+'%'
shtl[1].style.background=
 'radial-gradient(#090,#444)'
shtl[1].style.borderTopLeftRadius=55+'%'
shtl[1].style.borderBottomLeftRadius=55+'%' 
shtl[2].style.left=55+'%'
shtl[2].style.top=-22+'%'  
shtl[2].style.width=55+'%'
shtl[2].style.height=144+'%'	
shtl[2].style.background=
 'radial-gradient(#080,#444)' 
shtl[2].style.borderRadius=22+'%'
shtl[2].style.border='6px ridge #444'
shtl[2].style.borderRight='6px ridge transparent'
shtl[3].style.left=5+'%'
shtl[3].style.top=77+'%'  
shtl[3].style.width=99+'%'
shtl[3].style.height=33+'%'	
shtl[3].style.background=
'radial-gradient(#090,#444)'
shtl[3].style.borderTopLeftRadius=55+'%'
shtl[3].style.borderBottomLeftRadius=55+'%'
shtl[3].style.zIndex=-1
shtl[4].style.left=33+'%'
shtl[4].style.top=+33+'%'  
shtl[4].style.width=49+'%'
shtl[4].style.height=43+'%'	
shtl[4].style.background=
'radial-gradient(#666,#444)'	
shtl[4].style.borderRadius=27+'%'
shtl[4].style.zIndex=-2
	
flme[0].style.left=-44+'%'
flme[0].style.top=7+'%'  
flme[0].style.width=33+'%'
flme[0].style.height=99+'%'
flme[0].style.borderLeft='9px ridge #ff0'
flme[0].style.borderTop='9px ridge #ff0'
flme[0].style.opacity=0.2
flme[1].style.left=11+'%'
flme[1].style.top=6+'%'  
flme[1].style.width=22+'%'
flme[1].style.height=88+'%'
flme[1].style.borderLeft='22px ridge #b99'
flme[1].style.opacity=0
flme[2].style.left=-44+'%'
flme[2].style.top=7+'%'  
flme[2].style.width=33+'%'
flme[2].style.height=99+'%'
flme[2].style.borderLeft='9px ridge #ff0'
flme[2].style.borderTop='9px ridge #ff0'
flme[2].style.opacity=0.2
for(i=0;i<5;i++)
{ 
 strs[i].style.left=88*Math.random()+'%'
 strs[i].style.top=88*Math.random()+'%'
}
spce[0].style.zIndex=-1
spce[0].style.left=8+'%'
spce[0].style.top=4+'%'
spce[0].style.width=77+'%'
spce[0].style.height=8+'%'
spce[0].style.background='#ff0'
spce[0].style.opacity=0.2
spce[0].style.borderRadius=33+'%'
spce[0].style.transform='skew(-22deg)'
spce[1].style.left=67+'%'
spce[1].style.top=22+'%'
spce[1].style.width=12+'%'
spce[1].style.height=9+'%'
spce[1].style.borderRadius=44+'%'
spce[1].style.transform=
 'scale(0.4) translate(-599%,-199%) skew(-22deg)'
spce[2].style.width=99+'%'
spce[2].style.height=99+'%'
spce[2].style.background=
 'radial-gradient(#880,#080)'
spce[2].style.borderRadius=44+'%' 
spce[2].style.borderBottom='11px ridge #555' 
spce[3].style.left=-17+'%'
spce[3].style.top=-22+'%'
spce[3].style.width=128+'%'
spce[3].style.height=98+'%'
spce[3].style.background=
 'radial-gradient(#f0f,#800)'
spce[3].style.borderRadius=44+'%'
spce[3].style.zIndex=-1
spce[4].style.top=-22+'%'
spce[4].style.width=128+'%'
spce[4].style.height=98+'%'
spce[4].style.borderRadius=55+'%'
spce[4].style.borderBottom='11px ridge #ff0'  
spce[4].style.opacity=0
spce[5].style.top=-22+'%'
spce[5].style.width=128+'%'
spce[5].style.height=98+'%'
spce[5].style.borderRadius=55+'%'
spce[5].style.borderBottom='11px ridge #ff0'  
spce[5].style.opacity=0
 
adds[0].style.left=8+'%'
adds[0].style.top=4+'%'
adds[0].style.width=7+'%'
adds[0].style.height=8+'%'
adds[0].style.background=
 'radial-gradient(#fff,#777)'
adds[0].style.borderRadius=55+'%'
adds[0].style.borderBottom='1px ridge #ff0' 
adds[0].style.transform='skew(22deg)'
adds[1].style.left=8+'%'
adds[1].style.top=4+'%'
adds[1].style.width=77+'%'
adds[1].style.height=86+'%'
adds[1].style.background=
 'radial-gradient(#0f0,#070)'
adds[1].style.borderRadius=55+'%'
adds[1].style.borderBottom='1px ridge #ff0' 
 
 
strsX=111, strsY=-111, strsS=5
function clpl()
{
 sol[1].style.transform=
  'scale('+(1.1+Math.random()/2)+')'  
 plnt[0].style.left=Math.random()*77+'%'
 plnt[0].style.top=Math.random()*77+'%'  
 plnt[0].style.transform='scale('+Math.random()*2+')'
 plnt[1].style.left=Math.random()*77+'%'
 plnt[1].style.top=Math.random()*77+'%'  
 plnt[1].style.transform='scale('+Math.random()*2+')'
 plnt[2].style.left=Math.random()*77+'%'
 plnt[2].style.top=Math.random()*77+'%'  
 plnt[2].style.transform='scale('+Math.random()*2+')'
 for(i=0;i<5;i++)
 {
  strs[i].style.transform=
   'scale('+Math.random()*strsS+
   ') translate('+Math.random()*strsX+'%,'+
   Math.random()*strsY+'%)'
 } 
 spce[0].style.transform='scale(1,'+
  (1+Math.random()/2)+')'
 spce[3].style.transform='scale('+
  (1+Math.random()/2)+')'
 spce[4].style.transform='scale('+
  (1+Math.random()*2)+')'
 spce[5].style.transform='scale('+
  (1+Math.random()*2)+')' 
 adds[0].style.transform='scale(1,'+ 
  (1+Math.random()/2)+')'
}	  
bclsh=0 
function clsh()
{
 flme[0].style.transition=1+'s'
 flme[0].style.transform='scale('+(2,1+2*Math.random())+')'
 flme[2].style.transition=1+'s'
 flme[2].style.transform='scale('+(2,1+2*Math.random())+')'
 if(bclsh) 
  shtl[0].style.transform=
   'scale(1.1) skew(44deg)'
 else 
  shtl[0].style.transform=
   'scale(0.9) skew(55deg) '
     bclsh=!bclsh
}
   setInterval(()=>clpl(),1111)
   setInterval(()=>clsh(),2000)

shtl[0].onmouseover=()=>
{
 spce[0].style.opacity=0.6
 spce[1].style.transform=
  'scale(1) translate(-19%,0%) skew(22deg)'
 spce[2].style.borderBottom='33px ridge #550' 
 spce[4].style.opacity=1
 spce[5].style.opacity=1
 adds[0].style.borderBottom='15px ridge #ff0' 
 adds[0].style.transform=
  'scale(2) translate(99%,55%) skew(22deg)'
 shtl[0].style.transform=
  'scale(2) translate(-19%,55%) skew(22deg)'
 shtl[2].style.borderTopLeftRadius=55+'%'
 shtl[2].style.borderBottomLeftRadius=55+'%' 
 shtl[4].style.transform=
  'scale(2) translate(3%,23%)'
 flme[0].style.opacity=1
 flme[1].style.opacity=1
 flme[2].style.opacity=1
}
shtl[0].onmouseout=()=>
{
 spce[0].style.opacity=0.2
 spce[1].style.transform=
  'scale(0.4)translate(-599%,-199%) skew(-22deg)'
 spce[2].style.borderBottom='11px ridge #555' 
 spce[4].style.opacity=0
 spce[5].style.opacity=0
 adds[0].style.borderBottom='1px ridge #ff0' 
 adds[0].style.transform='skew(22deg)'
 shtl[0].style.transform='scale(1)  skew(44deg)' 
 shtl[2].style.borderRadius=22+'%'
 shtl[4].style.transform='scale(1)'
 flme[0].style.opacity=0
 flme[1].style.opacity=0
 flme[2].style.opacity=0
}    

</script>
</body>
</html>
